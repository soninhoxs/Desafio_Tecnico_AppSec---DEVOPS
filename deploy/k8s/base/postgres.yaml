# PostgreSQL de LABORATÓRIO (1 réplica, volume local do kind).
# Em produção: banco gerenciado com alta disponibilidade, backup e PITR
# (ex.: Amazon RDS/Aurora Multi-AZ, Cloud SQL) — ver docs/RELATORIO.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coursesphere-db-initdb
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  01-app-user.sh: |
    #!/bin/bash
    # Cria o usuário da aplicação SEM privilégios de superusuário.
    set -euo pipefail
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres \
      --set=app_pw="$APP_DB_PASSWORD" <<'EOSQL'
    CREATE ROLE coursesphere LOGIN PASSWORD :'app_pw' NOSUPERUSER NOCREATEDB NOCREATEROLE;
    CREATE DATABASE coursesphere_production OWNER coursesphere;
    REVOKE ALL ON DATABASE coursesphere_production FROM PUBLIC;
    EOSQL
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: coursesphere-db
  labels:
    app.kubernetes.io/name: coursesphere-db
    app.kubernetes.io/component: database
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  serviceName: coursesphere-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: coursesphere-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coursesphere-db
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70      # usuário "postgres" da imagem alpine
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: docker.io/library/postgres:18.6-alpine3.24
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coursesphere-db
                  key: POSTGRES_PASSWORD
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coursesphere-db
                  key: APP_DB_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-h", "127.0.0.1"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-h", "127.0.0.1"]
            periodSeconds: 15
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: initdb
          configMap:
            name: coursesphere-db-initdb
            defaultMode: 0555   # executável: o entrypoint EXECUTA (não faz source) o script
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: coursesphere-db
  labels:
    app.kubernetes.io/name: coursesphere-db
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    app.kubernetes.io/name: coursesphere-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
