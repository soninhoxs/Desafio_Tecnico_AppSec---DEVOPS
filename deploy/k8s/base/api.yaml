# API Rails: 2+ réplicas atrás de um Service, com probes, limites,
# securityContext restrito (Pod Security "restricted") e escala automática.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coursesphere-api-config
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  RAILS_ENV: production
  RAILS_LOG_LEVEL: info
  RAILS_MAX_THREADS: "5"
  WEB_CONCURRENCY: "1"
  JWT_TTL_MINUTES: "60"
  ALLOWED_HOSTS: coursesphere.localhost,localhost
  CORS_ORIGINS: http://coursesphere.localhost:8080
  EXPOSE_INSTANCE_HEADER: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coursesphere-api
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coursesphere-api
  namespace: coursesphere
  labels:
    app.kubernetes.io/name: coursesphere-api
    app.kubernetes.io/component: api
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # nunca fica abaixo de 2 réplicas durante o deploy
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: coursesphere-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coursesphere-api
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: coursesphere-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Espalha as réplicas entre nós: um nó caindo não derruba a API.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: coursesphere-api
      containers:
        - name: api
          image: ghcr.io/coursesphere/coursesphere-api:latest-placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: coursesphere-api-config
            - secretRef:
                name: coursesphere-api   # criado pelo Terraform (fora do Git)
          env:
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # Boot do Rails pode levar alguns segundos: liveness só começa
          # depois que o startup passa.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Readiness testa o banco: sem banco, a réplica sai do Service
          # (não recebe tráfego) mas NÃO é reiniciada.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            preStop:
              # Dá tempo do endpoint sair do Service antes do SIGTERM.
              exec:
                command: ["sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: rails-tmp
              mountPath: /rails/tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: rails-tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: coursesphere-api
  labels:
    app.kubernetes.io/name: coursesphere-api
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app.kubernetes.io/name: coursesphere-api
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: coursesphere-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: coursesphere-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: coursesphere-api
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: coursesphere-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
# Migrações: rodam UMA vez por sync do ArgoCD, depois do banco (onda 0/1)
# e antes da API (onda 2). Fora do ArgoCD, rodam ao aplicar o manifesto.
apiVersion: batch/v1
kind: Job
metadata:
  name: coursesphere-migrate
  namespace: coursesphere
  labels:
    app.kubernetes.io/name: coursesphere-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coursesphere-migrate
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # emptyDir nasce root:755. Sem o fsGroup o entrypoint não cria /rails/tmp/pids.
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-db
          image: docker.io/library/postgres:18.6-alpine3.24
          command: ["sh", "-c", "until pg_isready -h coursesphere-db -p 5432; do echo 'aguardando banco'; sleep 2; done"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: migrate
          image: ghcr.io/coursesphere/coursesphere-api:latest-placeholder
          command: ["bundle", "exec", "rails", "db:prepare"]
          envFrom:
            - configMapRef:
                name: coursesphere-api-config
            - secretRef:
                name: coursesphere-api
          env:
            - name: INSTANCE_ID
              value: migrate
            - name: ALLOW_DEMO_SEED
              value: "true"
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: rails-tmp
              mountPath: /rails/tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: rails-tmp
          emptyDir: {}
