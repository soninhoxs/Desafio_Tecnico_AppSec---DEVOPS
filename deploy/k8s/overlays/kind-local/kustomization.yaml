# Variante para testar SEM registry: usa imagens construídas localmente e
# carregadas nos nós do kind (scripts/kind_load_images.sh).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

components:
  - ../../components/kind-network

images:
  - name: ghcr.io/coursesphere/coursesphere-api
    newName: coursesphere-api
    newTag: local
  - name: ghcr.io/coursesphere/coursesphere-frontend
    newName: coursesphere-frontend
    newTag: local
