# No kind os nós são containers Docker (rede 172.16.0.0/12). Libera os health
# checks do kubelet, que partem do IP do nó, apesar do default-deny.
# Em nuvem, troque pelo CIDR real dos nós.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kubelet-probes
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 172.16.0.0/12
