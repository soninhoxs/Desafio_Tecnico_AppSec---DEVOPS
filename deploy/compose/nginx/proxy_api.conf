# Configuração comum dos proxies para a API.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Request-Id $request_id;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Timeouts curtos: melhor falhar rápido e tentar outra réplica do que
# segurar conexões presas (falha em cascata).
proxy_connect_timeout 2s;
proxy_send_timeout 15s;
proxy_read_timeout 15s;

# Retry automático na OUTRA réplica quando a primeira está fora do ar.
# O Nginx não repete POST/PATCH/DELETE (não idempotentes) por padrão,
# então não há risco de criar um curso duas vezes.
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;
proxy_next_upstream_timeout 5s;
