# Balanceador de carga (Nginx) na frente de 2 réplicas da API + frontend.
#
#   http://localhost:8080/       -> frontend (SPA)
#   http://localhost:8080/api/*  -> api-1 / api-2 (round-robin), sem o prefixo /api
#
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Caminhos temporários graváveis pelo usuário sem privilégios (rootfs read-only).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # Log de acesso em JSON. "upstream" mostra QUAL réplica atendeu cada
    # requisição (evidência do balanceamento) e "request_id" correlaciona
    # com o log da API (o Rails reaproveita o X-Request-Id recebido).
    log_format json escape=json
        '{"ts":"$time_iso8601","event":"lb_access","request_id":"$request_id",'
        '"remote_addr":"$remote_addr","method":"$request_method","uri":"$uri",'
        '"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
        '"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time","user_agent":"$http_user_agent"}';
    access_log /dev/stdout json;
    error_log  /dev/stderr warn;

    # Proteção na borda (complementa o rate limit da própria API).
    limit_req_zone $binary_remote_addr zone=login:10m  rate=10r/m;
    limit_req_zone $binary_remote_addr zone=signup:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m  rate=30r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;

    upstream api_backend {
        # Round-robin (padrão). Uma réplica que falha 3x em 10s sai do
        # rodízio por 10s (health check passivo).
        server api-1:3000 max_fails=3 fail_timeout=10s;
        server api-2:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream frontend {
        server frontend:8080;
    }

    server {
        listen 8080;
        server_name _;
        limit_conn perip 50;

        # Saúde do próprio balanceador.
        location = /lb/health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Métricas da API são só para a rede interna (Prometheus).
        location = /api/metrics {
            return 404;
        }

        # Rotas de autenticação: limite bem mais baixo por IP.
        location = /api/login {
            limit_req zone=login burst=5 nodelay;
            include /etc/nginx/proxy_api.conf;
            proxy_pass http://api_backend/login;
        }

        location = /api/signup {
            limit_req zone=signup burst=5 nodelay;
            include /etc/nginx/proxy_api.conf;
            proxy_pass http://api_backend/signup;
        }

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            include /etc/nginx/proxy_api.conf;
            # Barra final: /api/courses -> /courses
            proxy_pass http://api_backend/;
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
        }
    }
}
