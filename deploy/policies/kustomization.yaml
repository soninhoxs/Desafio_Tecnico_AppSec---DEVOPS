# Políticas de segurança (Kyverno) aplicadas pelo ArgoCD depois do Kyverno.
# Complementam o Pod Security Admission "restricted" do namespace (que já
# exige non-root, sem privilege escalation, seccomp e capabilities drop ALL).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

commonAnnotations:
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true

resources:
  - disallow-latest-tag.yaml
  - disallow-service-account-token.yaml
  - require-probes.yaml
  - require-readonly-rootfs.yaml
  - require-resource-limits.yaml
  - restrict-image-registries.yaml
