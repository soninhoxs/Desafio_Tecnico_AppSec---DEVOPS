# Política de admissão do Kyverno (CEL). Aplica-se ao namespace coursesphere.
# Gerado em deploy/policies; ajuste validationActions para [Audit] para só reportar.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-service-account-token
  annotations:
    policies.kyverno.io/description: "A aplicação não fala com a API do Kubernetes: o token da service account não deve ser montado (menos credenciais para roubar). Modo Audit: só reporta."
spec:
  validationActions: [Audit]
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, jobs]
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: coursesphere
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validations:
    - expression: >-
        has(object.spec.automountServiceAccountToken) && object.spec.automountServiceAccountToken == false
      message: "Defina automountServiceAccountToken: false."
