# Política de admissão do Kyverno (CEL). Aplica-se ao namespace coursesphere.
# Gerado em deploy/policies; ajuste validationActions para [Audit] para só reportar.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/description: "Imagens com tag fixa (nunca :latest nem sem tag): deploy reproduzível e auditável."
spec:
  validationActions: [Deny]
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, jobs]
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: coursesphere
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validations:
    - expression: >-
        object.spec.containers.all(c, c.image.contains(':') && !c.image.endsWith(':latest')) && (!has(object.spec.initContainers) || object.spec.initContainers.all(c, c.image.contains(':') && !c.image.endsWith(':latest')))
      message: "Use uma tag imutável (ex.: sha-<commit>) — :latest ou imagem sem tag não são permitidas."
