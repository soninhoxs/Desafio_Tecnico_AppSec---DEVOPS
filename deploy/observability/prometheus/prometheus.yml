# Prometheus do ambiente docker compose.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: compose-lab

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # As duas réplicas da API, direto (sem passar pelo balanceador), para
  # medir cada instância separadamente.
  - job_name: coursesphere-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["api-1:3000", "api-2:3000"]
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: instance
        replacement: "$1"

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
