# Alertmanager do ambiente docker compose.
# Sem integração externa por padrão (os alertas ficam visíveis na UI em
# http://localhost:9093 e no Grafana). Para notificar, descomente um receiver
# (Slack, e-mail, PagerDuty...) e troque o "default".
route:
  receiver: default
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: default
      repeat_interval: 30m

receivers:
  - name: default
  # - name: slack
  #   slack_configs:
  #     - api_url_file: /run/secrets/slack_webhook
  #       channel: "#coursesphere-alertas"
  #       send_resolved: true

inhibit_rules:
  # Se tudo caiu, não precisa alertar réplica por réplica.
  - source_matchers: [alertname="ApiAllInstancesDown"]
    target_matchers: [alertname="ApiInstanceDown"]
