# CourseSphere — ambiente isolado de testes (produção-like).
#
#   python scripts/bootstrap_env.py      # gera .env com segredos aleatórios
#   docker compose up -d --build
#
#   App:          http://localhost:8080          (balanceador Nginx)
#   API:          http://localhost:8080/api/...  (2 réplicas: api-1 e api-2)
#   Grafana:      http://localhost:3001          (admin / GRAFANA_ADMIN_PASSWORD)
#   Prometheus:   http://localhost:9090
#   Alertmanager: http://localhost:9093
#
# Redes:
#   edge    -> balanceador + frontend
#   backend -> balanceador + API + Prometheus
#   data    -> API + PostgreSQL (internal: sem saída e sem acesso externo)
# Todas as portas publicadas só em 127.0.0.1.
name: coursesphere

x-api-env: &api-env
  RAILS_ENV: production
  DATABASE_URL: postgres://coursesphere:${APP_DB_PASSWORD:?rode scripts/bootstrap_env.py}@db:5432/coursesphere_production
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:?rode scripts/bootstrap_env.py}
  METRICS_TOKEN: ${METRICS_TOKEN:?rode scripts/bootstrap_env.py}
  ALLOWED_HOSTS: localhost,127.0.0.1
  CORS_ORIGINS: http://localhost:8080
  EXPOSE_INSTANCE_HEADER: "true"
  JWT_TTL_MINUTES: "60"
  RAILS_MAX_THREADS: "5"
  APP_VERSION: ${APP_VERSION:-local}

x-api: &api
  image: coursesphere-api:${APP_VERSION:-local}
  build:
    context: ./backend
    args:
      APP_VERSION: ${APP_VERSION:-local}
  read_only: true
  # O processo é uid 10001. Sem uid/mode o tmpfs nasce root:755 e o
  # entrypoint não consegue criar tmp/pids (Permission denied, migrate exit 1).
  tmpfs:
    - /tmp:uid=10001,gid=10001,mode=1777
    - /rails/tmp:uid=10001,gid=10001,mode=1777
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  mem_limit: 512m
  cpus: 1.0
  stop_grace_period: 30s
  restart: unless-stopped
  networks: [backend, data]
  depends_on:
    migrate:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "ruby", "-rnet/http", "-e", "exit(Net::HTTP.get_response(URI('http://127.0.0.1:3000/health/ready')).is_a?(Net::HTTPSuccess) ? 0 : 1)"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 30s

services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?rode scripts/bootstrap_env.py}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?rode scripts/bootstrap_env.py}
    volumes:
      - pg_data:/var/lib/postgresql
      - ./deploy/compose/postgres/initdb:/docker-entrypoint-initdb.d:ro
    networks: [data]
    shm_size: 128mb
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coursesphere_production"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Passo único de deploy: migrações (+ seed de demo se ALLOW_DEMO_SEED=true).
  # As réplicas só sobem depois que ele termina com sucesso.
  migrate:
    <<: *api
    command: ["bundle", "exec", "rails", "db:prepare"]
    restart: "no"
    environment:
      <<: *api-env
      INSTANCE_ID: migrate
      ALLOW_DEMO_SEED: ${ALLOW_DEMO_SEED:-false}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}
    networks: [data]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true

  api-1:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: api-1

  api-2:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: api-2

  frontend:
    image: coursesphere-frontend:${APP_VERSION:-local}
    build: ./frontend
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    restart: unless-stopped
    networks: [edge]

  lb:
    image: nginxinc/nginx-unprivileged:1.31.7-alpine3.24
    volumes:
      - ./deploy/compose/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/compose/nginx/proxy_api.conf:/etc/nginx/proxy_api.conf:ro
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    # Imagem stock (uid 101). 1777 deixa o pid e os temp files em /tmp.
    tmpfs:
      - /tmp:mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    restart: unless-stopped
    networks: [edge, backend]
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      # A imagem nginx-unprivileged traz curl, não wget.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/lb/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ---------------- observabilidade ----------------
  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/prometheus/rules:/etc/prometheus/rules:ro
      - prom_data:/prometheus
    secrets: [metrics_token]
    ports:
      - "127.0.0.1:9090:9090"
    networks: [backend]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.34.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./deploy/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    networks: [backend]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4.13
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?rode scripts/bootstrap_env.py}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/coursesphere-overview.json
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    networks: [backend]
    depends_on: [prometheus]
    restart: unless-stopped

secrets:
  metrics_token:
    environment: METRICS_TOKEN

networks:
  edge: {}
  backend: {}
  data:
    internal: true

volumes:
  pg_data: {}
  prom_data: {}
  grafana_data: {}
