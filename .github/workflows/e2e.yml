# Testes de ponta a ponta em ambiente isolado (docker compose no runner):
#  - versão CORRIGIDA: sobe tudo, prova o balanceamento entre as 2 réplicas,
#    roda os PoCs esperando "CORRIGIDO", o exercício de falha da dependência
#    externa (circuit breaker), um DAST (OWASP ZAP baseline) e tira prints;
#  - versão ORIGINAL (tag v0-original): roda os mesmos PoCs esperando
#    "VULNERÁVEL" — evidência reproduzível de cada achado;
#  - na main, publica as evidências em docs/evidencias/execucao/ (commit do bot).
name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixed:
    name: Versão corrigida — compose + balanceamento + PoC + ZAP
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Sobe o ambiente (Nginx + 2 réplicas da API + PostgreSQL + observabilidade)
        run: |
          python scripts/bootstrap_env.py
          docker compose up -d --build
          python scripts/wait_for_http.py http://localhost:8080/api/health --timeout 480
          mkdir -p out
          docker compose ps | tee out/compose-ps.txt
      - name: Balanceamento entre api-1 e api-2
        run: python scripts/lb_demo.py -n 20 | tee out/lb-demo.txt
      - name: PoCs — todas as vulnerabilidades devem estar CORRIGIDAS
        run: python security/poc/poc.py --base-url http://localhost:8080/api --expect fixed --out out/poc-corrigido.json | tee out/poc-corrigido.txt
      - name: Exercício de falha da dependência externa (timeout, retry, circuit breaker)
        continue-on-error: true
        run: docker compose exec -T api-1 bin/rails runner script/resilience_drill.rb 2>&1 | tee out/resiliencia-circuit-breaker.txt
      - name: DAST — OWASP ZAP baseline (passivo)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:8080
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-baseline
      - name: Prints da aplicação e do dashboard do Grafana
        continue-on-error: true
        run: |
          pip install --quiet playwright==1.64.0
          python -m playwright install --with-deps chromium > /dev/null
          python scripts/ci/capture_screenshots.py --out out
      - name: Evidências — logs JSON, métricas por réplica e cabeçalhos
        if: always()
        run: |
          mkdir -p out
          docker compose logs --no-color lb | tail -n 60 > out/lb-access-log.txt || true
          docker compose logs --no-color api-1 api-2 | grep '"event"' | tail -n 120 > out/api-logs-json.txt || true
          sleep 20  # garante pelo menos um scrape do Prometheus depois do último tráfego
          q() { curl -fsS --get 'http://localhost:9090/api/v1/query' --data-urlencode "query=$1"; }
          q 'sum by (instance) (http_server_requests_total{job="coursesphere-api"})' > out/prometheus-requests-por-instancia.json || true
          q 'sum by (event) (coursesphere_security_events_total{job="coursesphere-api"})' > out/prometheus-eventos-seguranca.json || true
          q 'sum by (instance, outcome) (coursesphere_external_requests_total{job="coursesphere-api"})' > out/prometheus-dependencia-externa.json || true
          curl -fsS 'http://localhost:9090/api/v1/targets' > out/prometheus-targets.json || true
          curl -sSI http://localhost:8080/ > out/headers-frontend.txt || true
          curl -sSI http://localhost:8080/api/health > out/headers-api.txt || true
          echo "GET http://localhost:8080/api/metrics -> HTTP $(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/metrics) (métricas só na rede interna)" > out/metrics-bloqueado-na-borda.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidencias-versao-corrigida
          path: out/
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --no-color --tail 200
      - if: always()
        run: docker compose down -v

  original:
    name: Versão original (v0-original) — PoCs devem mostrar as falhas
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: atual
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v0-original
          path: original
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Sobe a versão original (exatamente como publicada)
        working-directory: original
        run: |
          docker compose up -d --build
          python ../atual/scripts/wait_for_http.py http://localhost:3000/courses --status 401 --timeout 600
          docker compose ps
      - name: PoCs — todas as vulnerabilidades devem aparecer
        run: |
          mkdir -p out
          python atual/security/poc/poc.py --base-url http://localhost:3000 --expect vulnerable --out out/poc-original.json | tee out/poc-original.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidencias-versao-original
          path: out/
      - if: failure()
        working-directory: original
        run: docker compose logs --no-color --tail 200
      - if: always()
        working-directory: original
        run: docker compose down -v

  # Só na main e só quando as duas versões passaram: os resultados reais desta
  # execução viram arquivos versionados em docs/evidencias/execucao/ (artefatos
  # de workflow expiram e exigem login para baixar; o repositório não).
  publish:
    name: Publica as evidências no repositório
    needs: [fixed, original]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artefatos
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Monta docs/evidencias/execucao/ (tokens removidos)
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/ci/build_evidence.py artefatos docs/evidencias/execucao --commit "$GITHUB_SHA" --run-url "$RUN_URL"
      - name: Commit (o [skip ci] evita disparar os workflows de novo)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidencias/execucao
          if git diff --cached --quiet; then echo "nada a publicar"; exit 0; fi
          git commit -q -m "docs(evidencias): execução do E2E em ${GITHUB_SHA::7} [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
