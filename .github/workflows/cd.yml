# CD (GitOps): build -> scan da imagem (gate) -> SBOM -> push no GHCR ->
# assinatura (cosign, keyless) -> commit da nova tag no overlay do Kubernetes.
# O deploy em si é feito pelo ArgoCD, que observa o repositório: o commit É o
# deploy, e o histórico do Git é o histórico de releases (rollback = revert).
name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "deploy/k8s/overlays/kind/kustomization.yaml" # commits do próprio CD
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  build:
    name: Imagem ${{ matrix.component }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write   # push no GHCR
      id-token: write   # assinatura keyless (OIDC) com cosign
    strategy:
      fail-fast: true
      matrix:
        include:
          - component: api
            context: backend
          - component: frontend
            context: frontend
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: vars
        name: Nome e tag da imagem
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"   # GHCR exige minúsculas
          echo "image=ghcr.io/${owner}/coursesphere-${{ matrix.component }}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (local, ainda sem push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          tags: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
          build-args: APP_VERSION=${{ steps.vars.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - run: bash scripts/ci/install-tools.sh trivy
      - name: Gate — Trivy na imagem (HIGH/CRITICAL com correção disponível bloqueiam o deploy)
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}"
      - name: SBOM (CycloneDX)
        run: |
          trivy image --format cyclonedx --output "sbom-${{ matrix.component }}.cdx.json" \
            "${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.component }}
          path: sbom-${{ matrix.component }}.cdx.json
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        name: Push
        run: |
          docker push "${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}")
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Assina a imagem e anexa o SBOM como atestado (cosign keyless)
        run: |
          cosign sign --yes "${{ steps.push.outputs.digest }}"
          cosign attest --yes --type cyclonedx --predicate "sbom-${{ matrix.component }}.cdx.json" "${{ steps.push.outputs.digest }}"

  deploy-gitops:
    name: Deploy (commit da nova versão para o ArgoCD)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/ci/install-tools.sh kustomize
      - name: Atualiza as tags no overlay do kind
        working-directory: deploy/k8s/overlays/kind
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          tag="${{ needs.build.outputs.tag }}"
          kustomize edit set image \
            "ghcr.io/coursesphere/coursesphere-api=ghcr.io/${owner}/coursesphere-api:${tag}" \
            "ghcr.io/coursesphere/coursesphere-frontend=ghcr.io/${owner}/coursesphere-frontend:${tag}"
          cat kustomization.yaml
      - name: Commit e push (o ArgoCD sincroniza o cluster a partir daqui)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/overlays/kind/kustomization.yaml
          if git diff --cached --quiet; then echo "nada a atualizar"; exit 0; fi
          git commit -m "deploy: ${{ needs.build.outputs.tag }} [skip ci]"
          git push
