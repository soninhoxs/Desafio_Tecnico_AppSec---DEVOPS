# CD (GitOps): banco do Trivy no GHCR -> build -> scan da imagem (gate) ->
# SBOM -> push no GHCR -> assinatura (cosign, keyless) -> commit da nova tag
# no overlay do Kubernetes.
# O deploy em si é feito pelo ArgoCD, que observa o repositório: o commit É o
# deploy, e o histórico do Git é o histórico de releases (rollback = revert).
#
# O banco de vulnerabilidades (~130 MiB, artefato OCI) não é baixado dentro
# do gate. Um job publica a cópia em ghcr.io/<owner>/coursesphere-trivy-db e
# o cache do runner fica keyed pelo digest: deploy seguinte, sem bytes novos,
# não transfere o banco de novo. O gate continua reprovando HIGH/CRITICAL
# com correção disponível.
name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "deploy/k8s/overlays/kind/kustomization.yaml" # commits do próprio CD
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  trivy-db:
    name: Banco de vulnerabilidades (GHCR)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.db.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/ci/install-tools.sh trivy oras
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publica o banco no GHCR se o digest mudou
        run: bash scripts/ci/sync-trivy-db.sh
      - id: db
        name: Digest da cópia publicada
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          ref="ghcr.io/${owner}/coursesphere-trivy-db:2"
          digest="$(oras manifest fetch --descriptor "$ref" | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"].split(":",1)[1])')"
          if [[ ! "$digest" =~ ^[a-f0-9]{64}$ ]]; then
            echo "digest inesperado: ${digest}" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "banco ${ref} digest=${digest}"
      - name: Cache do banco (chave = digest, não baixa de novo se não mudou)
        id: trivy-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-db-${{ runner.os }}-${{ steps.db.outputs.digest }}
      - name: Aquece o cache a partir do GHCR
        if: success() && steps.trivy-cache.outputs.cache-hit != 'true'
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          trivy fs \
            --download-db-only \
            --scanners vuln \
            --skip-java-db-update \
            --cache-dir "$TRIVY_CACHE_DIR" \
            --db-repository "ghcr.io/${owner}/coursesphere-trivy-db" \
            --db-repository "mirror.gcr.io/aquasec/trivy-db" \
            --db-repository "ghcr.io/aquasecurity/trivy-db" \
            .

  build:
    name: Imagem ${{ matrix.component }}
    needs: trivy-db
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write   # push no GHCR
      id-token: write   # assinatura keyless (OIDC) com cosign
    strategy:
      fail-fast: true
      matrix:
        include:
          - component: api
            context: backend
          - component: frontend
            context: frontend
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restaura o banco do Trivy (sem baixar se o digest não mudou)
        id: trivy-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-db-${{ runner.os }}-${{ needs.trivy-db.outputs.digest }}
      - id: vars
        name: Nome e tag da imagem
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"   # GHCR exige minúsculas
          echo "image=ghcr.io/${owner}/coursesphere-${{ matrix.component }}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (local, ainda sem push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          tags: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
          build-args: APP_VERSION=${{ steps.vars.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - run: bash scripts/ci/install-tools.sh trivy
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Gate — Trivy na imagem (HIGH/CRITICAL com correção disponível bloqueiam o deploy)
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
          TRIVY_DB_FRESH: ${{ steps.trivy-cache.outputs.cache-hit }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          args=(
            --cache-dir "$TRIVY_CACHE_DIR"
            --db-repository "ghcr.io/${owner}/coursesphere-trivy-db"
            --db-repository "mirror.gcr.io/aquasec/trivy-db"
            --db-repository "ghcr.io/aquasecurity/trivy-db"
            --skip-java-db-update
            --severity HIGH,CRITICAL
            --ignore-unfixed
            --exit-code 1
          )
          # Cache quente = banco já atualizado neste workflow. Não baixa ~130 MiB de novo.
          if [ "$TRIVY_DB_FRESH" = "true" ]; then
            args+=(--skip-db-update)
          fi
          trivy image "${args[@]}" \
            "${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}"
      - name: SBOM (CycloneDX)
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: |
          trivy image \
            --cache-dir "$TRIVY_CACHE_DIR" \
            --skip-db-update \
            --skip-java-db-update \
            --format cyclonedx \
            --output "sbom-${{ matrix.component }}.cdx.json" \
            "${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.component }}
          path: sbom-${{ matrix.component }}.cdx.json
      - id: push
        name: Push
        run: |
          docker push "${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}")
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Assina a imagem e anexa o SBOM como atestado (cosign keyless)
        run: |
          cosign sign --yes "${{ steps.push.outputs.digest }}"
          cosign attest --yes --type cyclonedx --predicate "sbom-${{ matrix.component }}.cdx.json" "${{ steps.push.outputs.digest }}"

  deploy-gitops:
    name: Deploy (commit da nova versão para o ArgoCD)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/ci/install-tools.sh kustomize
      - name: Atualiza as tags no overlay do kind
        working-directory: deploy/k8s/overlays/kind
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          tag="${{ needs.build.outputs.tag }}"
          kustomize edit set image \
            "ghcr.io/coursesphere/coursesphere-api=ghcr.io/${owner}/coursesphere-api:${tag}" \
            "ghcr.io/coursesphere/coursesphere-frontend=ghcr.io/${owner}/coursesphere-frontend:${tag}"
          cat kustomization.yaml
      - name: Commit e push (o ArgoCD sincroniza o cluster a partir daqui)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/overlays/kind/kustomization.yaml
          if git diff --cached --quiet; then echo "nada a atualizar"; exit 0; fi
          git commit -m "deploy: ${{ needs.build.outputs.tag }} [skip ci]"
          git push
