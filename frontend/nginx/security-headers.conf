# Cabeçalhos de segurança do frontend (incluído em cada location: add_header
# não é herdado quando a location define os próprios).
#
# CSP: só scripts do próprio site (sem inline/eval). Exceções explícitas:
#  - Google Fonts (CSS e fontes) usadas em global.css;
#  - randomuser.me: API externa do "instrutor convidado" (fetch + foto).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://randomuser.me; connect-src 'self' https://randomuser.me; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# HSTS só tem efeito quando o site é servido via HTTPS (ingress/LB com TLS).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
